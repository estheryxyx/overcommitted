document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='ov')closeModal();return}
  var a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'nav':UI.view=el.dataset.view;if(UI.view==='today')UI.scrollCal=true;render();break;
    case 'day':UI.day=addDays(UI.day,Number(el.dataset.d));UI.scrollCal=true;render();break;
    case 'day-today':UI.day=todayISO();UI.scrollCal=true;render();break;
    case 'new-item':{
      var t0=el.dataset.t,pr=UI.view==='today'?{date:UI.day}:{};
      if(t0==='task'){pr.status='active';if(UI.view!=='today')delete pr.date;taskModal(null,pr)}
      else itemModal(t0,null,pr);
      break}
    case 'new-task':{
      var p={};
      if(UI.view==='today'){p.date=UI.day;p.status='active'}
      if(el.dataset.status)p.status=el.dataset.status;
      if(el.dataset.cat)p.cat=el.dataset.cat;
      else if(UI.view==='boards'&&UI.group==='status'&&UI.filter!=='all')p.cat=UI.filter;
      if(el.dataset.block){var bk=blockById(el.dataset.block);if(bk){p.blockId=bk.id;p.date=bk.date;p.status='active'}}
      taskModal(null,p);break}
    case 'edit':taskModal(id);break;
    case 'edit-block':itemModal(null,id);break;
    case 'open-block':blockCard(id);break;
    case 'card-edit':taskModal(id);break;
    case 'card-toggle':{var ct=taskById(id);if(ct){setStatus(ct,isDone(ct)?'active':'done');save();render();if(M&&M.type==='bcard')blockCard(M.id)}break}
    case 'toggle':toggleDone(id);break;
    case 'qa-add':quickAdd();break;
    case 'group':UI.group=el.dataset.g;render();break;
    case 'filter':UI.filter=el.dataset.c;render();break;
    case 'cats':catsModal();break;
    case 'backup':backupModal();break;
    case 'ideal-for-day':UI.pushDate=UI.day;UI.view='ideal';render();break;
    case 'new-habit':habitModal(null);break;
    case 'edit-habit':habitModal(id);break;
    case 'new-slot':slotModal(null,{});break;
    case 'edit-slot':slotModal(id);break;
    case 'edit-habit-log':hlogModal(id);break;
    case 'toggle-habit':{var he=hlogById(id);if(he){he.done=!he.done;save();render()}break}
    case 'log-habit':logHabit(id);break;
    case 'pd':UI.pushDate=addDays(UI.pushDate||todayISO(),Number(el.dataset.d));render();break;
    case 'pd-today':UI.pushDate=todayISO();render();break;
    case 'push-slot':{var ps=slotById(id);if(ps){pushHabit(ps.habitId,UI.pushDate,ps.start,ps.dur,ps.id);save();render();toast('Added to '+fShort(UI.pushDate))}break}
    case 'push-habit':pushHabit(id,UI.pushDate);save();render();toast('Added to '+fShort(UI.pushDate));break;
    case 'push-all':{
      var pdw=dowOf(UI.pushDate);
      S.ideal.filter(function(x){return x.dow===pdw&&habitById(x.habitId)&&!S.hlog.some(function(e2){return e2.slotId===x.id&&e2.date===UI.pushDate})}).forEach(function(x){pushHabit(x.habitId,UI.pushDate,x.start,x.dur,x.id)});
      save();render();toast('Added to '+fShort(UI.pushDate));break}
    case 'unpush':S.hlog=S.hlog.filter(function(x){return x.id!==id});save();render();break;
    case 'examples-habits':addExampleHabits(false);break;
    case 'm-day':el.classList.toggle('on');break;
    case 'm-days':{
      var pr=el.dataset.p,set=pr==='all'?[0,1,2,3,4,5,6]:pr==='weekdays'?[0,1,2,3,4]:pr==='weekend'?[5,6]:[];
      $$('#dayChips .chip').forEach(function(c){c.classList.toggle('on',set.indexOf(Number(c.dataset.d))>=0)});break}
    case 'clear-habits':
      if(!arm(el,'Click again to clear habits'))break;
      S.habits=[];S.ideal=[];S.hlog=[];save();closeModal();render();toast('Habits cleared');break;
    case 'mx-range':UI.mx.range=el.dataset.r;if(UI.mx.range==='custom'&&!UI.mx.from){UI.mx.from=todayISO();UI.mx.to=addDays(todayISO(),13)}render();break;
    case 'mx-cat':UI.mx.cat=el.dataset.c;render();break;
    case 'mx-toggle':UI.mx[el.dataset.k]=!UI.mx[el.dataset.k];render();break;
    case 'tl-scale':UI.tlScale=el.dataset.s;UI.tlOff=0;render();break;
    case 'tl':if(el.dataset.set!=null)UI.tlOff=0;else UI.tlOff+=Number(el.dataset.d);render();break;
    case 'edit-focus':focusModal(el.dataset.scale,el.dataset.key);break;
    case 'new-term':termModal(null);break;
    case 'edit-term':termModal(id);break;
    case 'new-plan':planModal(null);break;
    case 'edit-plan':planModal(id);break;
    case 'ms-add':msAdd(id);break;
    case 'ms-toggle':{var p1=planById(el.dataset.p),m1=p1&&p1.ms.filter(function(m){return m.id===el.dataset.m})[0];if(m1){m1.done=!m1.done;save();render()}break}
    case 'ms-del':{var p2=planById(el.dataset.p);if(p2){p2.ms=p2.ms.filter(function(m){return m.id!==el.dataset.m});save();render()}break}
    case 'ms-task':{var p3=planById(el.dataset.p),m3=p3&&p3.ms.filter(function(m){return m.id===el.dataset.m})[0];if(m3){S.tasks.push(newTask({title:m3.text,cat:p3.cat,status:m3.date?'active':'backlog',date:m3.date||null}));save();toast('Task added to your boards')}break}
    case 'examples':addExamples();break;
    case 'm-close':closeModal();break;
    case 'm-save':saveModal();break;
    case 'm-type':openType(el.dataset.t,carry());break;
    case 'm-del':if(!arm(el,'Click again to confirm'))break;deleteFromModal();break;
    case 'cat-add':{var cr=$('#crows');cr.insertAdjacentHTML('beforeend',catRow({id:'c'+uid(),name:'',color:PALETTE[cr.children.length%PALETTE.length]}));var ins=$$('input[type=text]',cr);ins[ins.length-1].focus();break}
    case 'cat-rm':if($$('#crows .crow').length<2){toast('Keep at least one category');break}el.closest('.crow').remove();break;
    case 'copy-export':copyExport();break;
    case 'do-import':{
      if(!arm(el,'Click again to replace everything'))break;
      var txt=($('#m-import').value||'').trim();
      try{var d=JSON.parse(txt);if(!d||typeof d!=='object'||(!Array.isArray(d.tasks)&&!Array.isArray(d.cats)))throw new Error('shape');S=normalise(d);save();closeModal();render();toast('Backup restored')}
      catch(err){toast('That does not look like a backup')}
      break}
    case 'clear-all':
      if(!arm(el,'Click again to clear everything'))break;
      S.tasks=[];S.blocks=[];S.plans=[];S.weeks={};S.months={};S.termFocus={};save();closeModal();render();toast('Cleared');break;
  }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&M){closeModal();return}
  if(e.key!=='Enter')return;

  if(t.id==='qa-title'){e.preventDefault();quickAdd();return}

document.addEventListener('dblclick',function(e){
  var ic=e.target.closest('.icol');
  if(ic&&!e.target.closest('.is')){
    var r0=ic.getBoundingClientRect(),m0=Math.max(0,Math.min(1425,Math.floor((e.clientY-r0.top)/IH*60/15)*15));
    slotModal(null,{dow:Number(ic.dataset.dow),start:m0});return;
  }
  var g=e.target.closest('.tg');if(!g||e.target.closest('.ev')||e.target.closest('.fb'))return;
  var r=g.getBoundingClientRect();
  var m=Math.max(0,Math.min(1425,Math.floor((e.clientY-r.top)/HH*60/15)*15));
  taskModal(null,{date:UI.day,start:m,status:'active'});
});

/* ---------- drag and drop (mouse; on touch screens tap an item to edit it) ---------- */
function dragItem(){
  if(!drag)return null;
  if(drag.kind==='block')return blockById(drag.id);
  if(drag.kind==='habit')return hlogById(drag.id);
  if(drag.kind==='slot')return slotById(drag.id);
  if(drag.kind==='hlib')return habitById(drag.id);
  return taskById(drag.id);
}
function clearDrop(){
  $$('.over').forEach(function(x){x.classList.remove('over')});
  var ind=$('#dropind');if(ind)ind.style.display='none';
  $$('.idrop').forEach(function(x){x.style.display='none'});
}
function idealMinute(e,z,dur){
  var r=z.getBoundingClientRect();
  var m=Math.round(((e.clientY-r.top)/IH*60-(drag&&drag.kind==='slot'?drag.off:0))/15)*15;
  return Math.max(0,Math.min(1440-dur,m));
}
function calMinute(e,it){
  var r=$('.tg').getBoundingClientRect();
  var m=Math.round(((e.clientY-r.top)/HH*60-(drag?drag.off:0))/15)*15;
  return Math.max(0,Math.min(1440-(it.dur||60),m));
}
function zoneFor(e){
  var z=e.target.closest&&e.target.closest('[data-drop]');
  if(!z||!drag)return null;
  var k=drag.kind,dz=z.dataset.drop;
  if(k==='block'||k==='habit'){
    if(dz==='block')z=z.closest('.tg');
    return (z&&z.dataset.drop==='cal')?z:null;
  }
  if(k==='hlib'||k==='slot')return dz==='iday'?z:null;
  if(dz==='iday')return null;
  return z;
}
document.addEventListener('dragstart',function(e){
  var el=e.target.closest&&e.target.closest('[draggable="true"][data-id]');if(!el)return;
  var r=el.getBoundingClientRect(),onCal=el.classList.contains('ev')||el.classList.contains('fb')||el.classList.contains('is');
  var scale=el.classList.contains('is')?IH:HH;
  drag={kind:el.dataset.kind||'task',id:el.dataset.id,off:onCal?(e.clientY-r.top)/scale*60:0};
  try{e.dataTransfer.setData('text/plain',el.dataset.id);e.dataTransfer.effectAllowed='move'}catch(x){}
  setTimeout(function(){el.classList.add('dragging')},0);
});
document.addEventListener('dragend',function(){
  drag=null;clearDrop();$$('.dragging').forEach(function(x){x.classList.remove('dragging')});
});
document.addEventListener('dragover',function(e){
  if(!drag)return;
  var z=zoneFor(e);if(!z)return;
  e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(x){}
  $$('.over').forEach(function(x){if(x!==z)x.classList.remove('over')});
  if(z.dataset.drop==='cal'){
    var it=dragItem();if(!it)return;
    var m=calMinute(e,it),ind=$('#dropind');
    ind.style.display='block';ind.style.top=(m/60*HH)+'px';ind.dataset.t=fTime(m);
  }else if(z.dataset.drop==='iday'){
    var it3=dragItem();if(!it3)return;
    var m3=idealMinute(e,z,it3.dur||30),ind3=z.querySelector('.idrop');
    if(ind3){ind3.style.display='block';ind3.style.top=(m3/60*IH)+'px';ind3.dataset.t=fTime(m3)}
  }else{z.classList.add('over');var i2=$('#dropind');if(i2)i2.style.display='none'}
});
document.addEventListener('dragleave',function(e){
  var z=e.target.closest&&e.target.closest('[data-drop]');
  if(z&&!z.contains(e.relatedTarget)){z.classList.remove('over');if(z.dataset.drop==='cal'){var i=$('#dropind');if(i)i.style.display='none'}else if(z.dataset.drop==='iday'){var i4=z.querySelector('.idrop');if(i4)i4.style.display='none'}}
});
document.addEventListener('drop',function(e){
  if(!drag)return;
  var z=zoneFor(e);if(!z)return;
  e.preventDefault();
  var it=dragItem();if(!it){drag=null;clearDrop();return}
  var kind=z.dataset.drop;
  if(drag.kind==='hlib'||drag.kind==='slot'){
    var m4=idealMinute(e,z,it.dur||30),dw=Number(z.dataset.dow);
    if(drag.kind==='hlib')S.ideal.push({id:uid(),habitId:it.id,dow:dw,start:m4,dur:it.dur||30});
    else{it.dow=dw;it.start=m4}
    drag=null;clearDrop();save();render();return;
  }
  if(drag.kind==='habit'){it.date=UI.day;it.start=calMinute(e,it);drag=null;clearDrop();save();render();return}
  if(drag.kind==='block'){
    it.date=UI.day;it.start=calMinute(e,it);
    S.tasks.forEach(function(t){if(t.blockId===it.id)t.date=UI.day});
  }else if(kind==='cal'){
    it.date=UI.day;it.start=calMinute(e,it);it.blockId=null;if(!it.dur)it.dur=60;if(it.status==='backlog')setStatus(it,'active');
  }else if(kind==='block'){
    var b=blockById(z.dataset.id);
    if(b){it.blockId=b.id;it.date=b.date;it.start=null;if(it.status==='backlog')setStatus(it,'active')}
  }else if(kind==='tray'){
    it.date=UI.day;it.start=null;it.blockId=null;if(it.status==='backlog')setStatus(it,'active');
  }else if(kind==='col'){
    if(UI.group==='status')setStatus(it,z.dataset.val);else it.cat=z.dataset.val;
  }else if(kind==='quad'){
    var q=z.dataset.q;
    if(q==='un')it.important=null;
    else{it.important=(q==='ui'||q==='ni');it.urgency=(q==='ui'||q==='ux')?'urgent':'normal'}
  }
  drag=null;clearDrop();save();render();
});

/* ---------- clock ---------- */
setInterval(function(){
  if(M||drag)return;
  if(UI.view==='today'){
    var n=$('.now');
    if(n&&UI.day===todayISO()){var d=new Date();n.style.top=((d.getHours()*60+d.getMinutes())/60*HH)+'px'}
  }else if(UI.view==='overview')render();
},60000);

save();
render();
})();
</script>
